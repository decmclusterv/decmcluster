<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DECM Cluster Newsletter</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      width: 100% !important;
      background-color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    table {
      border-collapse: collapse;
    }
    a {
      color: #2563eb;
    }
    @media only screen and (max-width: 600px) {
      .container-table {
        width: 100% !important;
        border-radius: 0 !important;
      }
      .content-padding {
        padding: 24px 20px !important;
      }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f9fafc;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f9fafc;">
    <tr>
      <td align="center" style="padding: 40px 16px;">
        <!-- Card Container -->
        <table border="0" cellpadding="0" cellspacing="0" width="100%" class="container-table" style="max-width: 560px; background-color: #ffffff; border-radius: 12px; border: 1px solid #eaecf0; box-shadow: 0 1px 3px rgba(16, 24, 40, 0.05);">
          
          <!-- Header -->
          <tr>
            <td style="padding: 0; background-color: #1e3a8a; border-top-left-radius: 12px; border-top-right-radius: 12px;">
              <img src="https://api.decmcluster.org/static/logo/header.jpeg" alt="DECM Cluster Newsletter Header" width="560" style="display: block; width: 100%; max-width: 560px; height: auto; border: 0; outline: none; border-top-left-radius: 12px; border-top-right-radius: 12px;" />
            </td>
          </tr>
          
          <!-- Body Content -->
          <tr>
            <td class="content-padding" style="padding: 32px; font-size: 14px; line-height: 1.6; color: #344054;">
              {{ body|safe }}
            </td>
          </tr>
          
          <!-- Footer -->
          <tr>
            <td class="content-padding" style="padding: 20px 32px; background-color: #f9fafb; border-top: 1px solid #f2f4f7; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="left" style="font-size: 12px; color: #98a2b3; line-height: 1.5;">
                    Displacement &amp; Evacuation Centre Management (DECM) Cluster<br />
                    This is an automated newsletter. If you wish to unsubscribe, please <a href="https://www.decmcluster.org/newsletter/unsubscribe" target="_blank" style="color: #2563eb; text-decoration: underline;">click here</a>.
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
